name: Rava Bridge
version: "0.10.0"
slug: ravabridge
description: A SIP door station or phone rings the Crestron Home touch panels, with the door's picture, without touching the panels' Rava setup
arch: [aarch64, amd64]
init: false
# SIP and RTP have to arrive on the house LAN as themselves, and the video
# leaves as multicast: no port mapping can do that, so the container shares
# the host's network.
host_network: true
map: [share:rw]
# Discovery writes what it finds back into these options through the Supervisor,
# so a found panel or door shows up on this page like one typed by hand.
hassio_api: true
boot: auto
startup: application
ingress: true
ingress_port: 8098
panel_icon: mdi:doorbell-video
options:
  # Find the panels (SIP scan of this subnet, then SIPINFO over SSH with the panel password) and the
  # doors (UniFi Access readers that speak third-party SIP, once `access` is filled in) at startup,
  # every six hours, and on POST /discover. Adds; never removes what a person entered.
  autodetect: true
  panel_user: admin
  panel_password: "2129918115"
  # The touch panels, as Crestron Home left them: peer-to-peer Rava, never registered anywhere.
  # `ext` is the panel's SIP local extension (console: SIPINFO -> "SIP local ext"); blank is fine.
  panels: []
  # Who may ring the house. A UniFi Access intercom registers here with this user/password;
  # `ring` names panels or groups, or "all". `door_id` is the Access door /unlock opens.
  doors: []
  # Optional: what a dialed number rings. Otherwise the door's `ring`.
  recipients: []
  #  - number: "0005"
  #    ring: ["1st floor"]
  # One H.264 stream for every panel in the group. The panels' own paging multicast is 227.1.1.1:1234.
  mcast: "227.1.1.2"
  mcast_port: 40002
  mcast_ttl: 16
  ring_seconds: 60
  # Registrar realm the door sees in the digest challenge.
  realm: ravabridge
  # Print every SIP message. Loud; the thing to turn on when a door will not ring.
  log_sip: false
  # Join the panels' Rava paging multicast group and record what a Crestron Home page looks like
  # on the wire (GET /pages). Observation only for now; the road to pages on the NAX speakers.
  page_listen: true
  page_group: "227.1.1.1"
  page_port: 1234
  # Send a live page on to the NAX speakers: the page's G.711 audio is decoded,
  # resampled and streamed to the AES67 sender add-on while it is still being
  # spoken. `url` is that add-on's API, `zones` the NAX zones to play it in.
  page_relay:
    enabled: false
    url: "http://127.0.0.1:8099"
    token: "2129918115"
    zones: []
  # Register with the Crestron Home processor as one or more intercom devices, so the rooms they
  # live in are pageable and their audio is addressed to the bridge. Each device must already exist
  # in the processor's config (added by Tools/mc4r_fake_panel.py) - its `uuid` is that device's
  # RpcClientGuid. `pin` is the UI-device / commissioning password.
  crpc:
    host: ""
    pin: "2129918115"
    debug: false
    # Face detection is lifted for the length of a call and put back after. The watchdog
    # checks this often, and restores it regardless after this long, so it can never stick.
    face_check_seconds: 20
    face_max_seconds: 300
  intercom_devices: []
  #  - name: NAX Speakers
  #    uuid: a99a07fd-019d-4353-9fb1-af265a49b721
  #    room_id: 52008
  #    sip_uri: nax@192.168.0.97
  # Optional: register into UniFi Talk as a third-party device so phones can ring the panels (audio).
  talk:
    host: ""
    port: 5060
    user: ""
    password: ""
    ring: ["all"]
  # UniFi Protect cameras ring the panels like a SIP door (the doorbell is a camera, not a SIP
  # device). Give the console host and an Integration API key (Protect app > Settings > Control Plane
  # > Integrations) and EVERY camera is found and listed here. A doorbell is switched on by default and
  # calls the panels on `ring`. Switch any other camera on with `call: true` and pick its `triggers`
  # from what that camera offers (shown in `available`): motion, person, vehicle, animal, package,
  # licensePlate, face, line, loiter, line:person, loiter:vehicle, or an audio alarm (alrmSmoke, alrmBark
  # ...). Needs ffmpeg (in the image): video is copied, audio transcoded; talkback goes out the camera's
  # own speaker when it has one.
  protect:
    host: ""
    api_key: ""
    autodetect: true
    # Log every event the console sends (type + camera). The way to watch triggers without ringing.
    debug: false
    ring: ["all"]
    cameras: []
    #  - name: Front Door          # filled in by auto-detect; edit `call` and `triggers`
    #    call: true
    #    triggers: ["ring"]
    #    quality: medium      # low | medium | high - medium starts fastest for its picture
    #    ring: ["all"]
    #    talkback: true
    #    pause_face: true    # stop it recognising faces while a call is up
    doorbells: []
  # Optional: POST /unlock opens this UniFi Access door.
  access:
    host: ""
    token: ""
    door_id: ""
  # The API on the LAN is locked by this bearer; ingress needs no token.
  api_token: "2129918115"
  api_port: 8098
  # Leave blank to pick the interface that reaches the first panel.
  bind_ip: ""
  sip_port: 5060
schema:
  autodetect: bool
  panel_user: str
  panel_password: password
  subnet: str?
  panels:
    - name: str
      host: str
      ext: str?
      port: int?
      hostname: str?
      groups:
        - str
  doors:
    - name: str
      user: str
      password: password
      host: str?
      door_id: str?
      ring:
        - str
  recipients:
    - number: str
      ring:
        - str
  mcast: str
  mcast_port: int
  mcast_ttl: int
  ring_seconds: int
  realm: str
  log_sip: bool
  page_listen: bool?
  page_group: str?
  page_port: int?
  page_relay:
    enabled: bool?
    url: str?
    token: password?
    zones:
      - str
  crpc:
    host: str?
    pin: password?
    debug: bool?
  intercom_devices:
    - name: str
      uuid: str
      room_id: int
      sip_uri: str
      model: str?
  talk:
    host: str?
    port: int?
    user: str?
    password: password?
    name: str?
    expires: int?
    ring:
      - str
  access:
    host: str?
    token: password?
    door_id: str?
  protect:
    host: str?
    api_key: password?
    autodetect: bool?
    debug: bool?
    face_check_seconds: int?
    face_max_seconds: int?
    ring_seconds: int?
    max_call_seconds: int?
    ring:
      - str
    cameras:
      - name: str
        user: str?
        camera_id: str?
        camera_name: str?
        call: bool?
        quality: str?
        talkback: bool?
        pause_face: bool?
        enable_rtsp: bool?
        cooldown_seconds: int?
        type: str?
        triggers:
          - str
        ring:
          - str
        available:
          - str
    doorbells:
      - name: str
        user: str?
        camera_id: str?
        camera_name: str?
        quality: str?
        talkback: bool?
        enable_rtsp: bool?
        ring:
          - str
  api_token: str
  api_port: int
  bind_ip: str?
  sip_port: int
