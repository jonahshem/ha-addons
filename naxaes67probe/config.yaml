name: NAX AES67 Probe
version: "0.2.1"
slug: naxaes67probe
description: Read-only PTP/multicast feasibility probe for AES67 into the DM NAX
arch: [aarch64, amd64]
init: false
host_network: true
# No host_pid. Supervisor honours it only when Protection mode is off, and then
# s6-overlay's /init is not pid 1 in the host's namespace and the container
# dies at once with "s6-overlay-suexec: fatal: can only run as pid 1" (J61).
# Nothing here needs the host's processes: GStreamer's PTP runs in userspace.
privileged: [NET_ADMIN, SYS_TIME, SYS_NICE, NET_RAW]
map: [share:rw]
boot: manual
startup: application
