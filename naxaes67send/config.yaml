name: NAX AES67 Sender
version: "0.14.0"
slug: naxaes67send
description: AES67 announcements into a DM NAX - a always-on stream, spoken into on demand
arch: [aarch64, amd64]
init: false
host_network: true
host_pid: true
privileged: [NET_ADMIN, SYS_TIME, SYS_NICE, NET_RAW]
map: [share:rw, homeassistant_config:rw]
boot: auto
startup: application
# So HomeUI can reach the control API through Home Assistant rather than
# needing a port open on the house LAN.
ingress: true
hassio_api: true
ingress_port: 8099
panel_icon: mdi:bullhorn
options:
  # Blank works it out: the interface is the one the kernel already routes the
  # multicast group out of. Set it only where that is wrong - a box with two
  # NICs on the house LAN, or one whose default route is a VPN. A name that is
  # not on the box is reported in the log and worked around, not obeyed.
  iface: ""
  mcast: "239.69.4.4"
  port: 5004
  session: "HA Announce 1"
  # A house can have more than one DM NAX. They all hear the same multicast
  # stream, so one sender serves every amplifier - the list is only about
  # which ones we may log in to and switch.
  amps: []
  # Find the amplifiers on this network at start, every six hours, and on the
  # settings page's Find amplifiers button. Anything serving Crestron's web UI
  # that is not a panel, processor, gateway or PDU is logged into with these
  # credentials; the ones that answer as an amplifier are added to `amps`
  # above. Adds only - never removes or edits an amplifier typed by hand. A
  # NAX that refuses the login is reported by name and address instead.
  # Crestron devices ship as `admin` or `chdevice` depending on firmware, so
  # both are tried (this one first) and the one that worked is saved.
  autodetect: true
  amp_user: admin
  amp_password: "2129918115"
  # Leave blank to sweep the /24 the stream leaves by. Set it for a house whose
  # amplifiers live on a different subnet from this box.
  subnet: ""
  # A house LAN is flat: this port is reachable by anything on it, so the API is
  # locked by default rather than open. The default matches the PIN this dealer
  # already uses for device logins, so a fresh install works without a lookup -
  # change it per site if that PIN is not yours.
  api_token: "2129918115"
  # Silence padded around a clip, in seconds. Raise these if an announcement is
  # clipped at the start (the zone fading in) or the end (buffers still draining
  # when the route is put back). Tuned by ear, per house.
  lead_seconds: 1.5
  tail_seconds: 3.0
  # The level a room is brought up to for an announcement, on the amplifier's
  # own 0-900 scale (600 is what these zones are configured to default to).
  # Only ever raises - a room already playing louder is left alone. Set 0 to
  # never touch a volume, and accept that a room left turned down hears nothing.
  announce_volume: 600
  # The Crestron Home processor. With this set, a room whose music a page
  # interrupted is told to play again the way the app does it; without it the
  # room comes back on the right source but paused.
  crpc_host: ""
  crpc_pin: "2129918115"
  # A sound before / after every announcement, by clip id - the shipped
  # sounds are `ding-dong` and `chime`; blank for none. A clip's own setting
  # (on the add-on's page) overrides this, and `before=none` on a request
  # overrides both. The door and gate lines ship set to ding-dong.
  chime_before: ""
  chime_after: ""
  # Fish Audio (fish.audio) speaks typed announcements and regenerates clips
  # from the add-on's page - the voice the shipped clips were made in. The key
  # is a developer API key; it bills from the API-credit wallet, which is
  # separate from any subscription. Normally left BLANK here: at every start
  # the add-on fetches the key from our Hub (logs.bav.homes, gated by admin +
  # the device PIN) and keeps it in the house's private
  # /config/.bav_fleet.json, so it is never published and never typed. The
  # page's key box writes that file too. A key typed here overrides it for
  # this house only, and stops the fetch. With no key
  # anywhere, typed text falls back to Home Assistant's TTS, then espeak-ng.
  fish_api_key: ""
  # The voice a new clip is spoken in unless the editor picks another.
  # Blank = "Jarvis", the voice of the shipped set.
  fish_voice: ""
  # Speakers and levels. Edited from the add-on's own page (Open Web UI) which
  # lists the amplifier's zones and the processor's page groups; kept here so
  # they survive and can be read. Percent as Crestron Home shows it.
  default_percent: 70
  zone_volumes: []
  speaker_groups: []
  api_port: 8099
schema:
  iface: str?
  autodetect: bool?
  amp_user: str?
  amp_password: password?
  subnet: str?
  mcast: str
  port: int
  session: str
  amps:
    - host: str
      user: str?
      password: password?
  # The single-amplifier options this add-on had before it could hold a list.
  # Optional, and still honoured, so that updating does not silence a house
  # that was working - see `api.amplifiers`.
  nax_host: str?
  nax_user: str?
  nax_password: password?
  api_token: str
  lead_seconds: float?
  tail_seconds: float?
  announce_volume: int?
  crpc_host: str?
  crpc_pin: str?
  chime_before: str?
  chime_after: str?
  fish_api_key: password?
  fish_voice: str?
  fish_model: str?
  key_server: str?
  default_percent: int?
  zone_volumes:
    - zone: str
      percent: int
  speaker_groups:
    - name: str
      zones:
        - str
      page_group: str?
  api_port: int
