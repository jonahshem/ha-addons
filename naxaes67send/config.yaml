name: NAX AES67 Sender
version: "0.3.5"
slug: naxaes67send
description: AES67 announcements into a DM NAX - a always-on stream, spoken into on demand
arch: [aarch64]
init: false
host_network: true
host_pid: true
privileged: [NET_ADMIN, SYS_TIME, SYS_NICE, NET_RAW]
map: [share:rw, homeassistant_config:rw]
boot: auto
startup: application
# So HomeUI can reach the control API through Home Assistant rather than
# needing a port open on the house LAN.
ingress: true
ingress_port: 8099
panel_icon: mdi:bullhorn
options:
  iface: end0
  mcast: "239.69.4.4"
  port: 5004
  session: "HA Announce 1"
  # A house can have more than one DM NAX. They all hear the same multicast
  # stream, so one sender serves every amplifier - the list is only about
  # which ones we may log in to and switch.
  amps: []
  # A house LAN is flat: this port is reachable by anything on it, so the API is
  # locked by default rather than open. The default matches the PIN this dealer
  # already uses for device logins, so a fresh install works without a lookup -
  # change it per site if that PIN is not yours.
  api_token: "2129918115"
  api_port: 8099
schema:
  iface: str
  mcast: str
  port: int
  session: str
  amps:
    - host: str
      user: str?
      password: password?
  # The single-amplifier options this add-on had before it could hold a list.
  # Optional, and still honoured, so that updating does not silence a house
  # that was working - see `api.amplifiers`.
  nax_host: str?
  nax_user: str?
  nax_password: password?
  api_token: str
  api_port: int
